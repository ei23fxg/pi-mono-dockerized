# Extra directories mounted into every Pi container.
#
# Format: <host-path>:<container-path>[:ro|:rw]
#   ~/shared:/shared:ro      read-only
#   /srv/data:/data           read-write (default)
#
# - Only full-line comments are supported.
# - ~ expands to your home directory.
# - Relative host paths are ignored.
# - Missing host paths are skipped with a warning.
# - Reserved targets such as /, /home/hostuser/.pi, /opt/pi-packages and the
#   current project path are ignored.
#
# ~/shared:/shared:ro
# /srv/datasets:/datasets:ro
# /home/you/projects:/projects
